# Dark theme matching the Next.js frontend's palette (see frontend/app/globals.css
# for the source of truth these colors are pulled from). Purely cosmetic —
# doesn't affect deployment behavior. Streamlit Cloud reads this automatically.
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0a0e14"
secondaryBackgroundColor = "#121821"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false
